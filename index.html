<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>resume-auto 终端预览</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p, li {
      color: #a0a0a0;
      line-height: 1.7;
      font-size: 13px;
    }
    code {
      background: #2c2c35;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>resume-auto · 浮层终端预览</h1>
    <p>右下角为 mock 终端。可试：折叠/展开、配置抽屉、开始（打演示日志）。</p>
    <ul>
      <li>主操作：开始 / 暂停 / 停止（连体按钮组）</li>
      <li>次操作：配置 / 导出 / 折叠</li>
      <li>折叠后点绿色悬浮球可再次展开</li>
    </ul>
  </div>
  <script type="module" src="/src/ui/preview.js"></script>
</body>
</html>
